<style>

<style>
/* Layout: a single reading column like a pocket book; a quiet sticky bar; leaves as the only ornament */
:root{
  --paper:#F2F4EE; --sheet:#FBFCF8; --ink:#1C2520; --muted:#5B685F; --rule:#D3D9CE;
  --leaf:#2D6848; --leaf-soft:#E1ECE3; --amber:#9C5B17; --amber-soft:#F3E6D4;
  --f-display:"Reem Kufi","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"Noto Naskh Arabic","Amiri","Traditional Arabic","Times New Roman",serif;
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --fs:19px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111613; --sheet:#171D19; --ink:#E4EAE3; --muted:#9AA79E; --rule:#2B352F;
  --leaf:#86C39D; --leaf-soft:#1E2E24; --amber:#E2A75C; --amber-soft:#2E2417; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111613; --sheet:#171D19; --ink:#E4EAE3; --muted:#9AA79E; --rule:#2B352F;
  --leaf:#86C39D; --leaf-soft:#1E2E24; --amber:#E2A75C; --amber-soft:#2E2417; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
#app{min-height:100%;overflow-x:clip}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--leaf);text-decoration:none;margin-inline-end:auto}
.btn{font-family:var(--f-ui);font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none;line-height:1.4}
.btn:hover{border-color:var(--leaf)}
.btn:focus-visible,.icon:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.btn.primary{background:var(--leaf);color:var(--sheet);border-color:var(--leaf)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.settings{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:760px;margin:8px auto 0;font-size:13px;color:var(--muted)}

/* Cover */
.cover{display:grid;gap:28px;justify-items:center;text-align:center;padding-block:24px 8px}
.cover svg{width:min(240px,70%);height:auto}
.cover h1{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,12vw,76px);line-height:1.15;margin:0;color:var(--leaf);text-wrap:balance}
.author{font-family:var(--f-display);font-size:20px;margin:0}
.note{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:20px;max-width:34em;text-align:start;font-family:var(--f-body);font-size:var(--fs);line-height:1.95}
.note h2{font-family:var(--f-display);font-size:16px;color:var(--amber);margin:0 0 6px;font-weight:500}
.note p{margin:0;text-align:justify}
.note .sig{margin-top:12px;font-family:var(--f-display);color:var(--leaf);font-size:15px}
.rights{font-size:13px;color:var(--muted);margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Contents */
.eyebrow{font-family:var(--f-ui);font-size:13px;color:var(--amber);letter-spacing:.02em;margin:0 0 4px}
.h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,42px);margin:0 0 8px;line-height:1.25;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 24px;font-size:15px;line-height:1.8}
.part{margin-top:28px}
.part h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 0 10px;color:var(--leaf);border-bottom:1px solid var(--rule);padding-bottom:6px}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc a{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;text-decoration:none;color:var(--ink);border-bottom:1px dashed var(--rule);font-family:var(--f-body);font-size:18px}
.toc a:hover{color:var(--leaf)}
.toc .cnt{font-family:var(--f-ui);font-size:13px;color:var(--muted);white-space:nowrap;align-self:center}

/* Reading */
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:2.6em 1fr;gap:12px;padding-block:18px;border-bottom:1px solid var(--rule)}
.num{font-family:var(--f-display);font-size:17px;color:var(--leaf);text-align:center;padding-top:4px}
.body{min-width:0}
.txt{font-family:var(--f-body);font-size:var(--fs);line-height:2;margin:0;white-space:pre-line;overflow-wrap:break-word;text-align:justify;text-justify:inter-word;text-align-last:start}
.verse .txt{line-height:2.2}
.tag{color:var(--leaf);font-family:var(--f-ui);font-size:.82em;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.icon{background:none;border:0;color:var(--muted);font-family:var(--f-ui);font-size:12.5px;cursor:pointer;padding:4px 2px;display:inline-flex;gap:4px;align-items:center}
.icon:hover{color:var(--leaf)}
.icon.on{color:var(--amber)}
.icon svg{width:15px;height:15px}
.chip{border:1px solid var(--amber);color:var(--amber);border-radius:999px;padding:1px 8px;font-size:12px;background:transparent;cursor:pointer;font-family:var(--f-ui)}
.orig{margin-top:10px;background:var(--amber-soft);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.9}
.orig b{font-weight:500;color:var(--amber)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.pager a{flex:1 1 200px;border:1px solid var(--rule);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);background:var(--sheet)}
.pager a small{display:block;color:var(--muted);font-size:12px}
.pager a span{font-family:var(--f-display);font-size:17px}
.pager .next{text-align:end}

/* Random leaf */
.leafcard{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:28px 22px;text-align:center}
.leafcard .txt{font-size:calc(var(--fs) + 3px);text-align:justify;text-align-last:center}
.leafcard .src{margin-top:14px;font-size:13px;color:var(--muted)}

/* Search */
.search{width:100%;box-sizing:border-box;font-family:var(--f-body);font-size:18px;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 16px}
mark{background:var(--leaf-soft);color:inherit;border-radius:3px;padding:0 2px}
.from{font-size:12.5px;color:var(--muted)}
.from a{color:var(--leaf)}

/* Edit log */
.log h2{font-family:var(--f-display);font-weight:500;font-size:21px;margin:32px 0 10px;color:var(--leaf)}
.log p,.log li{font-size:15px;line-height:1.9;text-align:justify}
.log ul{padding-inline-start:20px;margin:0}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.8}
th{font-weight:500;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
td.ref{white-space:nowrap;font-family:var(--f-display);color:var(--leaf)}
.ask{border:1px solid var(--amber);border-radius:12px;padding:6px 16px;background:var(--amber-soft)}
.empty{color:var(--muted);text-align:center;padding:40px 0;line-height:1.9}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
/* Book reader */
.wrap.rd{padding-block:12px}
.reader{display:grid;gap:10px;max-width:660px;margin:0 auto}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted);min-width:0}
.rhead span:first-child{font-family:var(--f-display);color:var(--leaf);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rhead span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:14px 4px 4px 14px;padding:26px 26px 20px;cursor:pointer;perspective:2200px;touch-action:pan-y;-webkit-tap-highlight-color:transparent;box-sizing:border-box;
  box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.22),-3px 3px 0 -1px var(--sheet),-3px 3px 0 0 var(--rule),-6px 6px 0 -1px var(--sheet),-6px 6px 0 0 var(--rule)}
.stage:focus-visible{outline:2px solid var(--leaf);outline-offset:3px}
.clip{overflow:hidden}
.flow{column-fill:auto}
.flow .item{break-inside:avoid}
.ptitle{break-before:column;break-after:column;height:var(--H);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.ptitle:first-child{break-before:auto}
.ptitle h2{font-family:var(--f-display);font-size:clamp(28px,7vw,40px);color:var(--leaf);margin:0;font-weight:700;line-height:1.3}
.ptitle p{margin:0;color:var(--muted);font-size:14px}
.chead{break-before:column;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.chead h3{font-family:var(--f-display);font-size:24px;margin:0;font-weight:700;line-height:1.4}
.chead p{margin:2px 0 8px;color:var(--muted);font-size:13px}
.leaf{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d;z-index:4}
.lp{position:absolute;top:0;transform-origin:right center;transform-style:preserve-3d}
.lf,.lb{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet)}
.lb{transform:rotateY(180deg);background:linear-gradient(to left,var(--sheet) 0%,var(--paper) 100%);box-shadow:inset 0 0 0 1px var(--rule)}
.lsh{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(to left,rgba(0,0,0,.26),rgba(0,0,0,.04) 50%,rgba(255,255,255,.06) 100%)}
.castsh{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;border-radius:inherit;background:linear-gradient(to left,rgba(0,0,0,.24),rgba(0,0,0,.06) 45%,rgba(0,0,0,0) 80%)}
.flatpg{position:absolute;inset:0;overflow:hidden;border-radius:inherit;z-index:2;pointer-events:none}
.ov{position:absolute;inset:0;padding:inherit;background:var(--sheet);border-radius:inherit;transform-origin:right center;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none;box-sizing:border-box;box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.22),0 0 24px rgba(0,0,0,.12)}
.rfoot{display:flex;align-items:center;gap:10px}
.rfoot .btn:disabled{opacity:.4;cursor:default}
.prog{flex:1;height:3px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--leaf);transition:width .3s}
.rhint{margin:0;text-align:center;font-size:12.5px;color:var(--muted)}
.btn[aria-pressed="true"]{border-color:var(--leaf);color:var(--leaf)}
@media (max-width:480px){.stage{padding:20px 18px 16px}}
@media (max-width:480px){.item{grid-template-columns:2em 1fr;gap:8px}.btn{padding:6px 8px;font-size:13px}}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .35s ease-out}@keyframes f{from{opacity:.4}to{opacity:1}}}
</style>
</head>

  <header class="bar">
    <div class="bar-in">
      <a class="brand" href="#cover">الورقة والغصن</a>

<script>
const A=String.raw;
/* ===== النصوص: [الرقم في المخطوطة، النص] ===== */
const BOOK=[
{part:"الورقة والغصن",chapters:[
 {id:"leaf-branch",sec:"أ",title:"الورقة والغصن",items:[
 [1,`تتشبث الورقة بغصنها أكثر من تمسكه بها... قريبا سيبتسم بورقة أخرى... وسيودعها أيضا بالطريقة نفسها!!`],
 [2,`(الغصن) و(الورقة) غير متجانسين لونا وتركيبا واتجاها وشكلا ودورا.`],
 [3,`أما لماذا كان الخريف هو الوقت المناسب الذي أعلنت فيه الورقة أنها تريد أن تعيش حياتها بعيدا عن الشجرة؟! فذلك ما لم تفصح عنه الورقة بعد.`],
 [4,`لا يشعر بأنين الأوراق التي انفصمت عن أغصانها إلا من اعتصر فؤاده الفقد!`],
 [5,`وأما ما كان من أمر الورقة، فقد وجدت ذاتها، وصنعت الظل الذي يناسبها، وتناست أمر الغصن الذي استل يده منها!`],
 [6,`حتى تلك الأوراق التي آثرت السقوط على مرفأ الانتظار.. لا يمكنها العودة إلى حضن أغصانها... هي تسلي نفسها فقط لبعض الوقت!`],
 [7,`قالت الورقة للغصن: كيف يغمض لقلبي جفن وتفاصيل انشطاراتك ما تزال تصطك في أوردتي؟!`],
 [8,`قالت الورقة للغصن:\n- سأنتظرك قرب المرفأ.\n- قال: وماذا لو هاجرت المرافئ أيضا؟!!`],
 [9,`قبل أن تغادر اعترفت الورقة للغصن أنها كانت تَسْلُكُ كلَّ (أقواله وأفعاله) في باب "الرؤى"؛ كي لا يصل شيء منها إلا عبر قنطرة "التأويل".`],
 [10,`قالت الورقة للغصن وقد رأته ناقمًا على المرآة: المرآة لم تنكسر... تفقد وجهك فهو الذي كان يتشظى!`],
 [11,`قال الغصن للورقة: من أنت؟\nقالت: أنا بَحّةُ الحُزْن التي أخطأها عازف الناي!`],
 [12,`قال الغصن للورقة: هل تعلمين؟ كلما ذكرتك أحدثتُ نَقْبًا في جدار المستحيل!`],
 [13,`نظرت الورقة إلى الغصن المطرق باستمرار وقالت: الحروف التي تتلكأ في حنجرتك ألم تنضج بعد؟!`],
 [14,`قالت الورقة للغصن: أتعلم أنّ دفئك لا يصل؟ وأن قلبك البارد هو الذي يجعل الدفء يذوي قبل أن ينبت في كفيك!`],
 [15,`قال الغصن للورقة: ترحل الكلمات من قلبي حية... وتذبل عندما تصل إليك... هل أصبح قلبك مقبرة كبرى للكلمات؟!`],
 [16,`قالت الورقة للغصن: وماذا ستفعل عندما يدهمك صقيع الغياب؟!\nقال: سأستدفئ بطيفك وذاكرتي!!`],
 [17,`"وينك"؟\n- ما أزال واقفًا حيث انسكبت آخر ابتساماتك!`],
 [18,`كنتَ الموجة الصاخبة التي تزدهي بقفزاتها وحسب،\nوكنتِ الشاطئ الذي ينظر إليها، ويعلم أنها ستنطفئ بمجرد أن تصل إليه.`],
 [19,`لم تكن غصنًا سيئًا إلى هذا الحد الذي يجعل الخريف يجردك من جميع أوراقك، ويغريها بأن تهزأ من غبائك قبل أن تنصرف عنك!\nصحيح أنك لم تحقق لها كل ما كانت تصبو إليه، لكنك فعلت كل شيء كان بوسعك أن تفعله!`],
 [20,`حرك عربته متجها إلى حديقة المنزل.. لفتته تلك الورقة وهي تتشبث بغصنها تشبث الرضيع بأمه... لم يبد على الغصن أنه يحاول الاستمساك بها.. استسلم لعربدة الهواء الذي يحاول اقتلاعها... لعب بها الهواء يمنة ويسرة ثم انتزعها... اختارت مكانا قصيا عن غصنها لتسقط فيه... شيعها بنظراته إلى أن استقرت على التراب.. رمق رجله المتضخمة واستسلم لنوبة بكاء.`],
 [21,`قبل أن يُفلت الغصن يده، قالت له الورقة: تبدو منهكا إلى درجة أنك لم تعد قادرا على حمل أحلامك!!`]
 ]}]},
{part:"تأملات ونصوص عابرة",chapters:[
 {id:"grew",sec:"ت",title:"كبرت وعرفت",items:[
 [1,`أعترف أنك أجدتّ الدور، وتقمصت الشخصية بشكل مُلْفت... لكنك لم تفطن أن الجمهور قد انصرف، والمسرحية الهزلية قد انتهت.`],
 [2,`كلما ذاب أمامي قناع أكتشف مدى سذاجتي! لكني لم أتعلم، ولم أهتم للبحث عما وراء الأقنعة! وظللت أتعامل مع كل قناع على أنه وجه حتى يذوب! #اعتراف`],
 [3,`#كبرت_وعرفت أن أقدر الناس على حفر ألم في نفسك لا يندمل هو ذلك الذي رهنت له قلبك يوما.`],
 [4,`#كبرت_وتعلمت أن الطرح "الجازم" فيما الأصل فيه "الاحتمال" مؤشر جهل وليس مؤشر علم!`],
 [5,`#كبرت_وعرفت أن الدموع تسقط لكنها لا تنحني!!`],
 [6,`#كبرت_وعرفت أن الضمائر الحية لا تضيء لنفسها وحسب، بل تنير مفاصل التاريخ وتجاعيد الزمن!!`],
 [8,`#كبرت_وعرفت أنّ الإنسان يُمضي شطرًا من حياته في البحث عن ذاته! والسعيدُ من وَجَدَ ذاته مبكرًا.`],
 [9,`#كبرت_وعرفت أن الصداقة أرخص ما تكون على قلب صنفين: صاحب المصلحة يبيعها بمجرد انقضاء مصلحته، والمؤدلج يبيعها بمجرد أن تختلف معه!!`],
 [10,`#كبرت_وعرفت أن الذين يتصنعون المثالية والكمال يعانون من خراب يكتسح ذواتهم من الداخل!`],
 [11,`#كبرت_وعرفت أن جروح الذاكرة قد تكفّ عن النزف.. لكنها لا تلتئم!`]
 ]},
 {id:"memory",sec:"ت",title:"على جناحي ذاكرة",items:[
 [12,`واصنع من صوتها ذاكرة؛ لترمم مسارب الفرح!`],
 [13,`ليس (ساذجا) ولا (غِرّا) ذلك الذي روّض ذاكرته لتكون مثقوبة تتسرب منها إساءات الآخرين، بل هو (نبيل)؛ والأمر كما قيل: "ما استقصى كريم قط".`],
 [14,`ذاكرتي ليست مخبأ آمنا لأتركَكَ فيها، أخشى أن تُرعبك الآلامُ المتصارعةُ هناك بحثًا عن مأوى.`],
 [15,`كنت أرعى الغنم وأنا صغير... ولا أزال أتحين الفرصة التي أعود بها إلى ذلك العالم المفعم بالجمال... ومما تعلمته آنذاك أنك إذا عرفت النغمة التي يحبها "القطيع" فبإمكانك أن تتنقل به حيث شئت!`],
 [16,`أوقد حنينك كلما.. ران الزمان على ندوب الذاكرة.`],
 [17,`(الذاكرة) عندما تنزف لا تمرض ولا تضمر، بل تستعيد صحتها وعنفوانها، فتحجب عن أعيننا كل شيء عدا انشطارات ماضٍ لن يعود!`],
 [18,`يمكنك الرحيل طبعا... غاية ما هنالك أن وجهك سيظل مصلوبا على ذاكرتي لبعض الوقت.. لبعض الوقت فقط!`],
 [19,`الصدع في جدار القلب يكفيه أن نحدث له صدعا موازيا في الذاكرة لينسرب كنعش من وهم!`],
 [20,`الذين يعانون من فرط (التذكر) تتقاطر أنفاسهم بين زمنين!`],
 [21,`الوخز الذي تشعر به في (ذاكرتك) بين حين وآخر ينبهك على نوافذك المشرعة على الماضي!`],
 [22,`نظريا... نتخفف من عبء ذاكرتنا قدر ما تنعتق أنظارنا لرؤية (يومنا).`],
 [23,`أطيلوا النظر إلى من تحبون حتى ترتوي عروق الذاكرة... ربما تكون يوما زادكم الوحيد!`],
 [24,`الذكريات المؤلمة ستظل ترهق ذاكرتنا ما لم نحاول التخلص منها! قد يكون من وسائل التخلص أن نحقنها في كلمات ونقذف بها بعيدا!`],
 [25,`أشرعة الذاكرة لا تنحني!`],
 [26,`إلى الماضي نطير على جناحي ذاكرة!`],
 [27,`سلام على الحاضرين روحا وذاكرة وإن تباعدت المسافات وتفرقت السبل... سلام على الراحلين روحا وذاكرة وإن دنت المسافات والتقت السبل!`],
 [28,`أشياء كثيرة تنسرب من الذاكرة إلا خذلان الأصدقاء كلما تقادم الوقت يحفر بعمق بقدر الخيبة والخذلان!`],
 [29,`في حقل (الحزن).. الأوراق الذابلة لا تسقط... وإنما تستحيل إلى (فنار) على مرافئ الدموع!!`],
 [30,`إذا أوجعتك ذاكرتك اغمسها في بحر النسيان وستكون بخير...`],
 [31,`لا تنسَ يومك وتظل مشدودا إلى أمس لن يعود وإن بقي مخبوءا في ذاكرتك، وغد لم يحن قطفه وإن كان حاضرا في أملك... ليومك حق.`],
 [32,`ما هذا الشحوب الذي غزا وجهك؟ أين ذهبت نضارته؟\n- لم تذهب بعيدا، أضفتها إلى رصيد ذاكرتي!`],
 [33,`كم نحن ظالمون لذاكرتنا إذْ نتيح فيها البقاء لمن لا يستحق!`],
 [34,`كلما أوجعك صقيع هذا العالم التحف ذاكرتك!!`],
 [35,`هذه الندوب التي تبدو على ذاكرتك تكسبك جمالا... وما الفرق بين غصن أجوف وناي إلا تلك الثقوب على وجنة الناي؟`],
 [36,`ليس لدي ما أخبئه لأفاجئك به حين تعود إلا هذا الحنين الذي يكبر يوما بعد يوم!`],
 [37,`لا يمكنك أن تُخبّئ "لحظة" فرح... لكن يمكنك أن تخبئ "ذكرى" فرح... لتستدفئ بها كلما أرهقك الحزن!`],
 [39,`على أنفاس سكون الليل.. يمكنك أن تتحسس (إبر) الذكرى.. إبرة إبرة!`],
 [40,`كل (ذكرى) تطل بوجه (حزين)!`],
 [41,`كيف تزعم أنك لن تحنّ وروحك ما تزال تحدو على "مقام" الغياب؟!`],
 [42,`عندما ينسدل على عيوننا الحنين تذوب ملامح الأشياء؛ فلا نرى إلا وجه من نحب ماثلا في كل شيء.. في كل شيء!`],
 [43,`أن تبقى ذكرى حية في بال أحدهم خيرٌ من أن تكون واقعًا ميتًا!`],
 [44,`ونظن أننا قد (تخطينا) ثم تكسرنا ذكرى عابرة...`]
 ]},
 {id:"eid",sec:"ت",title:"العيد وشفاه الفقد",items:[
 [45,`كانت السيارة أنيقة جدًا.. اشتراها من أول "مرتب"، انزوى في غرفة الأولاد والبنات والجدة، أوصد الباب.. حركها يمينًا.. شمالًا.. لم يشعر بتلك النشوة التي كانت تنتابه عندما يشارك أولاد الجيران اللعب بسياراتهم.. رفعها إلى أعلى.. حرك إطاراتها بأصابعه.. أعادها إلى الأرض وحركها بقوة ثم تركها تندفع لتصطدم بالجدار..`],
 [46,`(العيد) لا يخلق السعادة، وإنما يحفزنا على البحث عنها في دواخلنا!`],
 [48,`العيد لا يعيد (الابتسامة) التي سرقتها (الآلام) من شفاهنا بقدر ما يذكرنا (بالآمال) الغافية التي يمكن أن تستيقظ يوما!`],
 [49,`(تستاف) لغتي وذاكرتي رائحة (الحزن) كلما التفت قلبي إلى العيد!`],
 [50,`في العيد... ترقص البسمات على شفاه الفقد!!`],
 [51,`من لم يعرف لوعة الفقد لا يفهم معنى (الفرح المغموس في الشجن) ليلة العيد.`],
 [52,`العيدُ أنتِ.. كلاكما سفَرٌ.. بالقلب نحو خمائل الجَذَلِ!`],
 [53,`كل المحبين إذا لاح العيد يستدفئون بالذكريات!`],
 [54,`العيد... سيمفونية (فرح) تتهجّى لغتها من فم (الحزن)!`],
 [56,`العيد يفعم ذاكرتي بحزن عميق برائحة الفرح... وبوجنة بيضاء تكتنز كل تفاصيل جمالها في دهشة بحجم (شامة) حزن!`],
 [57,`يا صديقي، أحيانا نتوهم أننا تعافينا من جراحنا على أننا لم نزد في الحقيقة على أنْ تعايشنا معها!`],
 [58,`في مواسم الفقد تضمر الكلمات، وتتشقق الدموع على مساقط الوجع!`]
 ]},
 {id:"love",sec:"ت",title:"الحب والجمال",items:[
 [59,`من يحب أكثر.. يقوى على التغاضي "أكثر"؛ الحب "قوة".. وليس "ضعفا"!`],
 [60,`أيّ شحوب كان سيعتري الأرض لو لم تستيقظ على صوت امرأة!!`],
 [61,`كلما كلحت الدنيا بوجهك ابحث عن (الجمال) بداخلك وتفقّد ينابيع (الحب) لئلا تكون جفت دون أن تَفطن!`],
 [62,`الأرواح "النقية" لا يتثاءب فيها الحب... ولا تستفيق من الجمال.`],
 [63,`هل ينحاز "الحب" إلى (الفرح) أو إلى (الحزن)؟! بل هل ينحاز هو أو أن مخيال الشعوب هو الذي "يُحَيِّزه"؟`],
 [64,`في كل ليلة يطل فيها القمر يتفقد قلوبنا... يرمم ذاكرتنا... ويلملم شذرات الحب التي منحنا إياها وأهدرناها؛ ليعيد تشكيلها ويطل علينا من جديد!`],
 [65,`يمكنك أنْ تثق بقلبك ما دام مفعما بالحب!`],
 [66,`الحب يتكلم بصوت هادئ؛ ولذلك يحدث أن ينكسر على ضجيج المدن!`],
 [67,`حتى المستحيل يمكن أن يرتخي في قبضة الحب!`],
 [68,`واعلم يا بني أن (الإنسانيين) أنقى قلوبا، وأرقّ أرواحا، وأندى حروفا، عطشى إلى الحب مهما احتسوا منه! فإن استطعت أن تكون منهم فافعل.`],
 [69,`كم من الأماني البيض اندلقت على هذه الصخور فأنبتت واقعا أخضر مفعما بالإصرار والجمال!`],
 [70,`رهاننا هو الجَمال... لا سلاحَ نغزو به ضمائرهم المريضة إلا الجَمال، فإما أن يصيب منهم، وإما أن يعودوا إلى مخابئ قبحهم غير راشدين!`],
 [71,`(الأمل) يعني أن تظل قادرا على الركض وراء أحلامك!`],
 [72,`بين المحبين... قيمة (الكلمات) ليست في (كثرتها وتنميقها)، وإنما فيما (يصطف) خلفها من (مشاعر وأحاسيس).`],
 [73,`إذا أزهرت روحك فكل ما حولك ربيع!`],
 [74,`لا داعي للقلق... (صخب) الموج سينكسر قريبا على (هدوء) الرمل!`],
 [75,`نحن بخير ما دمنا قادرين على القفز باتجاه أحلامنا...`],
 [76,`الحرف الأنيق والكلمة الجميلة مرفأ آمن نأوي إليه كلما كلحت الحياة بوجوهنا.`],
 [77,`عند هطولك يدفأ ذلك اللحن المنسكب على الناي!`],
 [78,`القادمون من حقول الشعر لا يحملون مناجل... بل يحملون قلوبًا أرقّ من بحّة ناي!`],
 [79,`- منذ متى والشيب يُلَوِّح لك؟\n- منذ بدأت أقمع الطفل الذي بداخلي!`],
 [80,`حينما تغيب المرأة... يذبل الوقت.. ويستيقظ الجدب.. تذوي الأزهار.. وتختنق البلابل.`],
 [81,`حتى لو ابتسمتْ لك المرافئ.. لا راحة لك إلا في الرقص مع الأمواج!`],
 [82,`إذا كان قدرك أن تكون السفينة التي تنكرها المرافئ احتضن البحر بعمق؛ فقد خلقت لتستقر في عمقه لا على المرفأ!`],
 [83,`نعم كنت غيمة تظلني أينما كنت، لكني سأظل أتساءل متى ستهطلين؟!`],
 [84,`عندما تبتسمين يلتفت النهر.. ويكتمل البدر فجأة!`],
 [85,`- أتدري ما معنى أن نقتسم الحرف؟\n- أن نرحلَ معا على غيمة من نور!`],
 [86,`المشاعر كالطوفان مهما حاولت أن تحبسها ستصنع لنفسها منفذا ما!`],
 [87,`علاقة المرأة مع اللغة علاقة عميقة جدا، ولذلك حين تكتب المرأة تنثال بين يديها اللغة كجدول من نور!!`],
 [88,`- أحتاج إلى غمامة أغتسل بدموعها!\n- جرّب أنْ تغتسل بدموعك أنت.. وستكون أنقى!`],
 [89,`صباحٌ دون وجهك مشروخ... لا يلتئم إلا بك!`],
 [90,`احنُ على أحلامك كغيمة تناغي على صدرها دهشة الصباح.`],
 [91,`- متى ينكسر الحرف الدافئ؟\n- إذا سقط على القلب الفظ!`],
 [92,`لأمرٍ ما قد يلتفت النهر.. كأنْ تهمسي له مثلا!`],
 [93,`- ما الليل؟\n- المرفأ الذي لا يبرم بازدحام الحائرين!`],
 [94,`يغفو مستندا إلى كومة أحلام فات وقتها وباتت بلا روح!`],
 [95,`الأمل مساحة البياض التي نرسم عليها شراعا يقودنا إلى مرفأ! قد تكون وهما، لكنه وهم حلو نغرق فيه بتلذذ!!`],
 [96,`حتى لو غارت نجوم القلب أو ذبلت سيظل أثرها حيا تماما كنجوم السماء... سرُّ ولعِنا بزهرات السماء ما بينها وبين أزهار القلب من تجاذب!`],
 [97,`لو كان للقلوب أجنحة لتطير إلى من تحب... كم من جسد سيسقط دون قلب؟!`],
 [98,`وكن كالطفل يوقظ الابتسامات الغافية، ويرأب القلوب الكسيرة، ويمدّ شريانًا من الحب لكل أحد!`],
 [99,`وكن كالمورد العذب يبذل ماءه لكل طالب، ثم لا يعنيه من يستحق ومن لا يستحق!`],
 [100,`س: وما الحب؟\nج: هو حاصل قسمة الثواني على النبضات مضروبا في هروب كل نبضة من قلب إلى قلب آخر.`],
 [101,`س: ما النبضة؟\nج: هي أصغر وحدة لقياس الحب!`],
 [102,`والحب عندما يطرق قلبا يطرقه كريشة! ثم إن الراوي تنحنح وقال: ولذلك تسمعه القلوب الرقيقة وحدها!`],
 [103,`وكان على المسافات أن تذوب كلما ازدادت حرارة أشواقنا!`],
 [104,`كلما تقدمت في الحب "نبضة" ستتفاجأ كيف أن قلبك بهذا الاتساع الذي يمكنه أن يحتضن العالم كله دون أن يغص!`],
 [105,`كلما اقتربنا من بعضنا أكثر انكشفت عيوبنا لبعضنا أكثر! ولذلك يتوجب شكر المسافات التي تدرأ عنا انكشاف المزيد من العيوب! وفي النهاية لن يتجاسر على قبولنا كما نحن بعيوبنا إلا أصدقاؤنا الذين لم يراهنوا على مثاليتنا وإنما راهنوا على واقعنا... علينا كما نحن!`],
 [106,`قال الراوي: والشعراء أكثر الناس تلفتا إلى قلوبهم؛ لتفقد من يسكن فيها!`],
 [107,`ربما كان الذي اخترع فكرة النوافذ مشتاقا أراد أن تخترق نظراته رقابة الجدار!`],
 [108,`كلما ظننا أن المسافة انحسرت بيننا داهمتنا العاصفة وبعثرت الخرائط، وضيعنا الطريق!!`],
 [109,`تظل المشاعر متدفقة وحية حتى نحاول تصنيفها وعقلنتها!`],
 [110,`طبيعة المشاعر لا تستجيب دائما للتسبيب، وكثيرا ما نفشل في الوقوف على دوافع مشاعر ما تجاه شخص ما!`],
 [111,`ما دمت لن تُفْتَقد.. لكل الأماكن نفس الرائحة!`],
 [112,`وكنتِ النسيم الذي حرّك قلبي.. ثم تحول إلى عاصفة!`],
 [113,`تستفزّك الأماني مرتين: مرة حين تراوغك وتتجاهل يدك الممدودة إليها، ومرة حين تركض نحوك وقد فات وقتها!`],
 [114,`خنجر البعد كان أليمًا، لكنه كان صادقًا أيضًا وهو يخبرني بأني لم أكن واحدًا من أولوياتك كما توهمتُ!`],
 [115,`سنكون أجمل وأنقى كلما رقصت قلوبنا على "مقام" الطفولة الذي لا يتسلل إليه زيف!`],
 [116,`أحيانًا، جمال الأمور ودهشتها في عفويتها، وليس في تنميقها والمبالغة في الترتيب لها.`],
 [117,`في كل شبر وقفنا فيه معا بذرت حلما.`],
 [118,`وكنتِ وحدكِ الثيمة التي ترتب فوضاي!`]
 ]},
 {id:"silence",sec:"ت",title:"الصمت وشهوة الكلام",items:[
 [119,`عندما اطمأن السراج أن الجميع قد نام بخير.. ابتلع مواجعه وانطفأ!`],
 [120,`يبالغ في الاحتفاء بكثيبٍ من صَمْت ليخبئ قلبه فيه!`],
 [121,`إذا أردتَّ أن ترى كيف تنتحر الكلمات على شفتيك، فانطق بها في أزمنة الصمت!`],
 [122,`ولم أجدْ كالصمتِ: حريّةً وقيداً.`],
 [123,`في بعض الثقافات الكلام من "ذهب"، وفي بعضها الكلام من "فضة" بينما الصمت من "ذهب"!! قلت: والذي يرتفع بالكلام أو الصمت إلى قيمة "الذهب" هو (التوقيت) الأنسب.`],
 [124,`كلما أحرقه وهج الكلام.. تلفّع بالصمت.. ومضى!`],
 [125,`النظرة تلو النظرة مع الصمت الطويل صوفية العشاق التي لا يدركها إلا العارفون!`],
 [126,`أنْ تَصْمتَ يعني أنْ تُهَذِّبَ شهوةَ الكلام.`],
 [127,`يقف واجما كحرف الرويّ المصلوب على قافية الحزن!`]
 ]},
 {id:"scenes",sec:"ت",title:"مشاهد",items:[
 [128,`ما زال صامتًا متكئا على أريكته يحتسي المزيد من الوقت!`],
 [129,`كان مبعثرا واجمًا على رفوف الوقت... استجمع قواه ولملم نفسه من جديد.. ولما استوى واقفا مرت به قصيدة مكتنزة فتشظى من جديد.`],
 [130,`النادل هو النادل، والقهوة هي القهوة، لكن غاب كل الأصدقاء... وغاب معهم طعم القهوة الذي كنت أجد!`],
 [131,`... عندما كانت بعض الحروف تتسلق حبالي الصوتية وتنتفض في الخارج أشعر أنها أصوات غريبة لا أعرفها.. ألتفتُ باتجاه عقارب الساعة وبعكسها.. ألتفّ في حركة خذروفية فلا أجد إلا نفسي!... سما الكلام حتى فني في الصمت.. لا حدود فاصلة بينهما.. ولست الآن على يقين تام ما إذا كنت متحدثا أو صامتا...\nنصحني أحدهم أن أذهب إلى (مَطْهَر) يتحول الإنسان فيه إلى مومياء متحركة تزاول حياتها بكفاءة وتمارس نشاطها اليومي وإن كانت تفتقد بعض الحواس.. راقت لي الفكرة.. وأنا في طريقي إلى ذلك المطهر.. حولي جمع غفير من الناس.. يبتلعونني.. يريحون أقدامي من عناء السير.. آه ما أريح السير مع الجموع!`],
 [132,`- إنني أشعر بمعاناتك صدقني!\n- أصدقك، لكنك تتعاطفين معي، أما أن تشعري بي!!!\n- أتشكك في وفائي؟\n- كلا، يا سيدتي! ولكن "المرايا" تعكس اشتعال النار ولا تعكس حرارتها!\nتنزع حدقتيها من عينيه بعنف وتشيح بوجهها!`],
 [133,`الكل يحاول أن يحظى بشرف المشاركة في عزف سيمفونية استفزازي... حتى ذلك النورس الذي يحلق وعيناه مغروستان في الأسفل... إنه لا يكف عن مراقبتي!`],
 [134,`عندما شكوت إلى صديقي غالب سوء توافقي الاجتماعي لم أكن أريد أكثر من تفريغ ما بداخلي من شحنات، ولم يكن يعنيني أن يستمع إليّ أو لا يستمع.. بل أظنني كنت أرغب ألا يسمع ولا يعي، لكن الأمور سارت على غير ما توقعت فلم أكد أفرغ من حديثي حتى اعتدل في جلسته.. أعلم جيدًا أنه لا يفعل ذلك إلا إذا شعر أن لديه كلامًا مهمًا...\n- "العلاج عندي.. وبوصفة سهلة لن تكلفك شيئًا... فقط نفذ ما سأقوله لك وسترى أن كثيرًا من الأفواه ستعشش على رأسك... وأن وابلًا من القبلات سيمطر يدك.. ستجد حفاوة متناهية.. ويكون لك الكثير الكثير من المريدين والزوار.. وستوجه إليك الكثير من الدعوات..."\n- "مهلًا، أنا لا أبحث عن أكثر من الوئام الاجتماعي"\n- "لا تكن أبله، أنا لا أبالغ، إني أعني كل كلمة قلتها.. كل المقومات لديك.. نبرات صوتك جيدة.. ينقصك أن تتعلم الصراخ.. نعم عليك بالصراخ"\nاتّجهتُ إلى المكان المناسب وأخذت أصرخ.. وأصرخ.. حتى شعرت أني بلغت مرحلة الإتقان..\nولما عدت إليه وجدته قد نسج لي قناعًا مناسبًا.. أعانني على ارتدائه وقال: هذا كل شيء..\nاعتدت أن أوجه إليه رسالة sms شكرًا وعرفانًا قبل كل لقاء وقبل أن تدار الكاميرات وتتزاحم المايكروفونات حدّ الاختناق لالتقاط حروفي التي أنثرها هنا وهناك بكرم وأريحية.`]
 ]},
 {id:"people",sec:"ت",title:"في الناس والمواقف",items:[
 [135,`ربما تدرك يومًا أنّ من حق غيرك أن يمارس خياراته، سواء كانت خياراته جيدة من وجهة نظرك، أم كانت غير ذلك. وربما تدرك متأخرًا أنك لو لم تشغل بالك بالأمر من أساسه لكان أجدى!`],
 [136,`مخطئٌ مَن ظنّ أنه سيستمدّ عظمته من احتقاره للآخرين!!`],
 [137,`لا أحد يمكنه أن يحتفظ بآرائه في دائرة الصواب وإن اجتهد. الخطل ينسرب إلى أفكارنا وآرائنا؛ لأننا بشر، وغير منزهين.`],
 [138,`"المتاجرة" بقضايا الناس وقيمهم لا تستلزم رأس مال أكثر من "اللؤم"!`],
 [139,`كلما وجدت نفسك في مركز الدفاع عن مؤسستك... تأكد من سلامة موقفك (ضميريا)... مؤسستك... لن تكون دائما على حق.`],
 [140,`نحن في النهاية بشر وتتنازعنا أهواء البشر بغض النظر عن الأوصاف (عالم، مثقف...)، والموفق من مكنه الله من تقليم حظوظ نفسه.`],
 [141,`العمل ضمن فريق يقتضي أن يتخلى كل عنصر عن بعض اشتراطاته الخاصة حفاظا على انسجام الفريق وتكافؤ أفراده.`],
 [142,`مؤسفٌ أنّ مِن الناس مَن لا ينظرون إلى علاقاتهم ببعضهم على أنها "قيمة"؛ ولذلك يبنونها على القَشّ!!`],
 [143,`نفتش عن (أسباب) أخطائنا في كل من هم حولنا، ونتناسى غالبا أن نفتش عن تلك الأسباب في أنفسنا!`],
 [144,`المصاب بشهوة الكلام إذا لم يجد ما يقوله فإنه لا بد أن يقول شيئا!!`],
 [145,`بعضهم يتصورون (العداء) و(الكُرْه) شرطَ وجودٍ؛ ولذلك ما غاب عدوّ إلا اصطنعوا غيره!!`],
 [146,`الانشغال بـ(من رضي) من الناس يستحيل مع الوقت والانشغال بدهشة الرضا إلى (سلطة) و(قيد)!`],
 [147,`كل هذا العالم الفسيح يصير كخرم إبرة.. إذا تنفّذ المؤدلجون!`],
 [148,`يولد (الطفل) مزودا بفطرة السؤال إلا أن (الكبار) يكبتون هذه الفطرة، و(المدارس) تكاد تخنقها.`],
 [149,`ثمة "هالة بيضاء متعالية" الجميع يضع نفسه فيها عندما يتحدث عن سلبيات المجتمع!!`],
 [150,`في النهاية نحن بشر... و(العقل) لا يشكل إلا بعدا واحدا من أبعاد شخصيتنا... لنعترف بأننا لسنا دائما موضوعيين كما نحب أن نكون!`],
 [151,`من الطبيعي أن نتوجس من بعضنا ما دام هيكل علاقاتنا مؤسسا على سوء الظن!!`],
 [152,`بعضهم يخلطون بين حقهم في الاختلاف وبين قلة الأدب والسفه ويوردونهما موردا واحدا... كأنهم لا يدركون أنه يمكنهم أن يختلفوا بأدب ورُقِيٍّ!!`],
 [153,`ليس جديرا بالاحترام من يعيد ترتيب سُلّم مبادئه كلما تغيرت شروط اللعبة...`],
 [154,`ما دام الإنسان يتوقع أن سعادته في (المفقود) فستكون السعادة أسطورته التي تَشْدَهُ الأعين دون أن تراها!!`],
 [155,`ربما لا تكون (السعادة) في (المفقود) الذي تبحث عنه، وإنما في (الموجود) الذي تغفل عنه!`],
 [156,`الحاجة اليوم قائمة إلى ترميم العلاقة بين (العربي) و(لغته) وإلى إعادة بناء الثقة بينهما...`],
 [157,`لستَ ذا (مبدأ) وإنما صاحب (هوى)، ما دمتَ تتعامل مع مبادئك بانتقائية، تقبل ما وافق هواك أو مصلحتك، وتُنكر ما صادمهما!`],
 [158,`كل (حقبة زمنية) تخلق مشاكلها وهمومها وتحدياتها التي تشكل فيما بعد (ملامحها) وتصير جزءا من (تكوينها) الثقافي المرحلي! ترى ماذا عن مرحلتنا؟!`],
 [159,`كيف تعرّف (الأقارب)؟\nفي (الواقع)، هم مجموعة من الناس يجمعهم الموت، وتفرقهم الحياة!`],
 [160,`إذا اتسعت الفجوة (بينك) وبين (ذاتك) واحتجت إلى وسيط يعرفك بها فعليك أن تبحث (عنك)؛ فقد تكُون مُفرَّقا في مفاصل الزمان والمكان دون أن تعلم!`],
 [161,`من الإنصاف أن نقرأ نتاج الكاتب في سياق عصره هو، فثمة فجوة حتمية بين زمن الكتابة وأدواته وحيثياته وزمن القراءة وأدواته وحيثياته...`],
 [162,`له كنانتان في إحداهما سهام مسمومة.. وفي الأخرى ورود يانعة... فإذا وجد الناس يرمون أحدا رماه... وإن وجدهم يهدون شخصا أهداه...`],
 [163,`"الأصنام" لا تصنع نفسها.. عبادها هم الذين يصنعونها!!!`],
 [164,`بعضهم لا يستطيع أن "يرى" نفسه إلا في وضع "المقارنة" مع غيره!!`],
 [168,`طفق ينعى على الناس أنهم لا يناضلون من أجل الفوز بحريتهم كما فعل! لم يفطن إلى أنه لم يزد على أن أخرج رأسه من "ربق" ووضعه في "ربق" آخر!!`],
 [169,`احتفظ بأناقتك الأخلاقية، ولا تجعلها أشبه بورق الجدران الأنيق، الذي يتساقط سريعا؛ لأنه لم يلصق على مكان نظيف!`],
 [170,`عندما تذوب أقنعتهم التي يرتدونها بين حين وآخر بحسب المنافع... سيجدون أنفسهم بلا "وجه" ولا ملامح ولا منافع.`],
 [171,`طريقة تفكيرك هي "المنظور" الذي ترى من خلاله الأشياء، وتحلل به الوقائع، فإذا كان "منظورك" يختلف عن "منظور" غيرك فهذا لا يعني أن أحدكما لا يفكر!`],
 [172,`أنا مسؤول عما أقول، وليس عن فهمك لما أقول!`],
 [173,`إذا حضرت "المصلحة" غاب المنطق.`],
 [174,`إذا اختلف معك حدق في وجهك؛ ليُصَنِّفَك... ولديه من القوالب ما يستوعب جميع المظاهر والحالات!`],
 [175,`لك (صيغتك) الخاصة التي لا تشبه أحدًا، المفارقة أن من الناس من يرحب بأن تكون ذا صيغة متفردة، لكنهم في الآن ذاته يريدونك وفق الصيغة التي يحبذونها!`],
 [176,`"التناسي" انعتاق أنيق من ارتهانات لحظات مضت!!`],
 [177,`"قبول الرأي" المختلف ليس معناه أن يتحدث أحدنا ويصمت الآخر!`],
 [178,`يبدو أن مساقط الغيث أبعد مما كان يتوقع "الرائد"!!`],
 [179,`علمتني الحياة أنّ مَنْ يَعِدُ بـ(كل شيء) قَلَّ أنْ يَفيَ بشيء!`],
 [180,`الذين يدمجون المبادئ في الأشخاص إذا (خاب) ظنهم في الشخص (انهار) في نفوسهم المبدأ!!`],
 [181,`منطقة الوسط مزعجة للطرفين المتطرِّفَين... وهي مُستهدفة بالأذى من الجانبين!`],
 [182,`كلما اتسع "الهامش" ضاق "المتن"!!`],
 [183,`إذا لم يفعل أحدهم ما كنت تؤمله منه فالذنب ليس ذنبه! إن كان من ذنب فهو ذنبك أنت؛ لأنك رسمت له في ذهنك طريقا ليس مرغما على السير فيه!`],
 [184,`النفوس الهشة لا تنتظر ما يحفزها على (السقوط) بل تبحث عنه، فإن أعياها البحث (سقطت).`],
 [185,`مَن تَعوّد على (الانحياز) لا يمكنه أن يفهم معنى أن تقف على مسافة واحدة من مختلِفَين!`],
 [186,`(حُلْمُك) هو (الحلقة) التي تصل (واقعك) بـ(طموحك).`],
 [187,`(حِلْمُك) هو (المسافة) التي تحول دون انعكاس (انفعالاتك الداخلية) على قراراتك وسلوكك.`],
 [188,`قال المُؤوِّل: إذا صحّتْ رؤياك فسيكون...\nقاطعه الرائي: ولماذا تُعلق الأمر بصحة رؤياي؟ فقد تصحّ رؤياي ولا يصحّ تأويلك!`],
 [189,`الذين (تخلوا) عن فكرة أن يظهروا أمام الناس بمنتهى المثالية (اقتنعوا) بأنهم بشر يصيبون ويخطئون ويتناقضون ويعترفون بأخطائهم وتناقضاتهم...`],
 [190,`في حين ترى أنت أن (الشطارة) في ارتداء (أقنعة) المثالية يرى غيرك أن (الشطارة) و(المثالية) في أن يبدو كما هو بلا أقنعة!`],
 [191,`يبدو أن كثيرا من (الناس) يؤمنون بالحرية والتسامح عندما تتفق مع ما يريدون فقط، وحين تصطدم برغباتهم فلا حرية ولا تسامح ولا تقبل!`],
 [192,`خلع (نزاهته).. علقها.. أقفل عليها بإحكام.. ثم هبط ليتفرغ لمعركته مع المخالفين!`],
 [193,`ويحصل أن تغتبط بمن يقف أمامك مبتسما... وأنت لا تدرك أن ابتسامته تتجاوزك إلى القابع خلفك ليسدد لك طعنة من الخلف! فطوبى للأنقياء الذين يحتفون بالابتسامة التي أمامهم ولا يشغلهم البحث عن مسوغاتها، ولا يشغلهم الالتفات إلى المتربصين في الخلف!`],
 [194,`وعلى من أراد أن يكون (حقيقيا) تحمل تبعات وجوده في عالم الأشباح؛ لأنها لا ترحم من يختلف معها!...`],
 [195,`الصبر (زينة) و(أناقة) و(جمال)... كم من المواقف والظروف ستر ضعفنا أمامها الصبر.`],
 [196,`يمكنك أن تتكور وتتدحرج بعيدا عني... ما أنت بأول المزيفين الذين كانوا يرقصون حولي.. ولن تكون آخرهم!`],
 [197,`من غير اللائق أخلاقيا وثقافيا أن يظهر المثقف الذي ينافح عن التعدد والاختلاف بمظهر البرم والضائق صدره بكل مختلف.`],
 [198,`قد نختلف حول قضية ثقافية معينة وهذا طبيعي، ما ليس طبيعيا أن نجتر تبعا لهذا الاختلاف ما تحويه قواميسنا من شتائم وقذف وقذائف!`],
 [199,`بعض المثقفين يملك من السطوة والنفوذ الإعلامي ما يعينه على تغليف خلافه الشخصي بلبوس (ثقافي)! ويجعل من نفسه ضحية مع أنه قد يكون الجلاد!`],
 [200,`الجور والبهتان والفجور في الخصومة تجدها عند عدد من المتنازعين مهما اختلفت أطيافهم الفكرية... ما نصطلح عليه بالمثقفين ليسوا بمنأى عن هذا!`],
 [201,`هذه (الأعماق) بركان خامد مؤقتا.. إن لم نَغُصْ ونَغَصّ فيها وبها بهدوووء ثارت هي! وقتها سنذوب فيها عوض أن تذوب فينا!`]
 ]},
 {id:"culture",sec:"ت",title:"الثقافة والوعي",items:[
 [202,`الثقافة -كما أفهمها- رؤية مؤسسة على معلومات ومعرفة واسعة لكنها ليست هي المعلومات والمعارف ذاتها!`],
 [203,`من بنى درجات سُلَّمِه من (الكذب) و(النفاق) فعليه أن يتحسس مسقطه!`],
 [204,`كل الذين يصفقون للقبح ويحتفون به هم شركاء في كل ما يتناسل عنه من قبح وأذى!`],
 [205,`الوعي لا يعني أننا (فهمنا) أنفسنا وما حولنا بما يكفي، بل يعني ألا نتوقف عن (محاولة) فهم أنفسنا وما حولنا!`],
 [206,`الذي لا يمكنه فصل (المبادئ) عن (الأشخاص)، كلما سقط من عينه شخص انهار في نفسه مبدأ!`],
 [207,`عندما تعبر منطقة صراع بين إيديولوجيتين باتجاه فكرتك قلّ أن تمرّ بسلام، فالقوم هناك لا يفرقون بين المحارب وعابر السبيل!`],
 [208,`يُحَدِّث سُلَّم (مبادئه) و(قيمه) بحسب الاتجاه الذي تهب فيه المصلحة... البراغماتي.`],
 [209,`إذا أردت حساب مقدار الجزء الزائف منك فقِسْ المسافة بين ما أنت عليه حقيقة وبين ما تحاول أن تظهره للناس!!`],
 [210,`بين ما (تريد) وما (يريدون)... إما أن تكون (أنت) أو تكون (هم)!`],
 [211,`رائع أن تعمل وفق مبادئك لا وفق مصالحك الخاصة ولا وفق ضغوط ذوي المصالح الشخصية.. وسيعترضك أذى من حيث لم تحتسب، فكثير من الناس يقاتلون دون مصالحهم بضراوة قبل أن يفكروا في مشروعيتها وستشعر بنوع من الوحدة فذوو المبادئ (فعلا) ليسوا بالكثرة التي تتوقعها! لكنك ستكون منسجما مع ضميرك بشكل جيد وهذا سيملأ عليك وحدتك رضا!`],
 [212,`بعض الأصحاب (ضَيِّق العَطَن) بشكل لا يتصور، إذا لم (توافقه) في رأي أو توجه انقلب عليك وبرم بك وهجرك ونسي كل ما كان من (ظاهر) الود! وبعضهم يتخذ منك صاحب (مرحلة)، وتلك (المرحلة) هو الذي يحددها وفق (احتياجاته)!`],
 [214,`الحلم كالبذر... إن لم تسقه بالأمل لا يعيش!`],
 [215,`لسانك يقول (ما تريد) أن يعتقدوه عنك.. وسلوكك يقول (ما تعتقده) بالفعل!`],
 [216,`الوقت أثمن من أن (نريقه) في جدل عقيم!`],
 [217,`بين أن تكون (فعلا) وأن تكون (ردة فعل) قفزةٌ تسمى (مبادرة).`],
 [218,`من الخيبة أن تعادي (قيمة) عليا فقط لأنك تعادي شخصا يؤمن بها!`],
 [219,`ألسنة بعضهم (متسخة) بالبذاءة والفحش، ولن يطهرها تظاهرهم بالدفاع عن قضايا.`],
 [220,`(الإشارات) و(الإيماءات) قد تكون كونية الممارسة.. لكنها محلية التأويل!`],
 [221,`بعضهم تختلط لديه المفاهيم، فعلى حين يكون غارقا في (سوء الظن) يحسب أنه في (منتهى الوعي).`],
 [222,`من المهم أن (تقبض) على الفكرة، ومن المهم أيضا أن (تطلقها) في اللحظة المناسبة.`],
 [223,`الفكرة فرس جموح والمثال قيد! بعضهم يحبس نظره في القيد ويغفل عن الفرس!`],
 [224,`لا تحمل أحكام "العاطفة" على محمل الجد... قد تكره غدا ما تحبه اليوم وتتغير المرآة!`],
 [225,`عندما ندرك أن الكلمة مسؤولية سندقق ونفحص ونتبين قبل أن نكون مجرد أداة إعلانية لأحد..`],
 [226,`الكذب يحمل أدوات تقويضه فيه!`],
 [227,`هناك من يبحث عن صديق.. وهناك من يبحث عن بوق... الصديق ثابت.. والبوق متحوّل!`],
 [228,`يبدو أن الذهن يستحسن (التصنيف) لأنه يسهل (الحكم)، مع أن التصنيف قد ينطوي على (التعميم)... والتعميم لا يخلو من خطل!`],
 [229,`كم هو مؤلم أن تكون آخر من يعلم بأنك لم تكن أكثر من حجر يُحَرَّك على رقعة شطرنج!`],
 [230,`يأبى الشعر أن يبقى على (الرف) إلى وقت الطلب! وحدهم الذين أخلصوا للشعر أخلص لهم.`],
 [231,`علينا (وحدنا) أن نتحمل (تبعات) رفع سقف توقعاتنا من الآخرين... الآخرون يتحركون وفق إمكاناتهم وظروفهم وقناعاتهم لا وفق توقعاتنا نحن!`],
 [232,`كلما حام حوله لؤمهم تدثر بالصبر ومضى...`],
 [233,`قلّ أن يعمل العقل والعاطفة في الآن ذاته بالكفاءة نفسها!`],
 [234,`أن (تفتح) عقلك لا يعني أن تجعله جرابا يتلقف الأفكار وحسب، بل يعني أن تكون قادرا على استيعاب الأفكار المختلفة ومحاورتها ثم تقبل أو ترفض عن بينة.`],
 [235,`عندما تسيطر عليك فكرة الضحية، فأنت بالفعل ضحية! ضحية تفكيرك طبعًا.`],
 [236,`لا تبحث عن الشمس بعيدا فهي تشرق من داخلك.. افتح النافذة التي بداخلك لتراها!`],
 [237,`(البذاءة) لا يبررها شيء... مهما تكن درجة اختلافنا مع غيرنا يمكن أن نوصل أفكارنا وقناعاتنا ولغتنا بكامل نظافتها وأناقتها.`],
 [238,`هناك خريطة ما تُحرَّك على أساسها أحجار الشطرنج... ما لم تفطن إلى تلك الخريطة فلن تفطن إلى السرِّ في سقوط حجر وبقاء آخر!`],
 [239,`انتصر لنفسك على نفسك بأن تعترف بأخطائك وتصلحها حتى ولو تلقفتها من فم خصمك... يظل الخطأ خطأ بغض النظر عن أهداف من نبه إليه.`],
 [240,`مرونة اللغة تتيح التأويل... مرونة التأويل تتيح للإنسان أن يُكيّف ما (يسمع) أو (يقرأ) ليكون وفق ما (يريد)!`],
 [241,`"العلوم" ليس بينها صراعات وحروب... الحروب والصراعات في عقول "المتعاملين".`],
 [242,`سيفوتك اكتشاف الكثير من أخطائك ما دمت لا ترى ولا تصغي إلا للمتفق معك.`],
 [243,`(أهميتك) تنبع من (ذاتك) وليس من (علاقاتك) بالآخرين.`],
 [244,`من جعل الشعر (هامشا) لم يجعله الشعر (متنا).`],
 [245,`تتمدد عيوبك كلما شغلت نفسك بعيوب الآخرين!`],
 [246,`#تعلمت_سنة_1437 أن اللئيم لو أرقت له ماء القلب ليكتحل به سيظل لئيما!!`],
 [247,`#تعلمت_سنة_1437 أنّ (الجميل) لا يُزهِر إلا في ضمير (الأوفياء).`],
 [248,`#تعلمت_سنة_1437 أن أحتفظ بمساحة هدوء وتفهم بيني وبين الناس الذين يبنون علاقاتهم سريعا وينهونها سريعا.`],
 [249,`#تعلمت_سنة_1437 أن كثيرا من الناس يضبطون بوصلة (مبادئهم) وفق (مصالحهم) الذاتية البحتة!`],
 [250,`مشكلة (المتوجس) أنه لا يبصر الخطوط الفاصلة بين (أوهامه) و(الواقع)!`],
 [251,`كلما ظهرت فجوة في تفكيره.. ردمها بالوهم!`],
 [252,`جلس هادئا أمام النهر لفترة طويلة.. تلفت حوله وأدرك بأنه لم يحرك ساكنا منذ جلس هنا! قرر أن يترك أثرا... تناول حجرا ورماه في النهر.. وغادر!`],
 [253,`#عرفت مِن الناس مَن لديه استعداد أن يصنع مِن أقرب الناس إليه سُلّما ليرتقي عليه.`],
 [254,`#عرفت من الناس من يصادم الفكرة ويعاديها (على الرغم من اقتناعه بها)؛ لأنه يبغض صاحبها!`],
 [255,`هناك من يلاحقون أحلامهم وهناك من يتربصون بهم وبها! المتربصون لا أحلام لهم فانشغلوا بأحلام الآخرين!`],
 [256,`قفوا عند آرائكم حتى تستوي ما دمتم تؤمنون بها... فإن أدرتم ظهوركم لها فهذا يعني أنكم تنازلتم عنها!`],
 [257,`لا ترم رأيك وتذهب؛ الرأي مثل البذرة إن تعهدتها وسقيتها نبتت واستوت، فإن لم تفعل أنت ذلك برأيك فلن يفعله أحد غيرك!`],
 [258,`أصعب أنواع العَمَه والعمى أن تستميت في الدفاع عن شخصك وأنت تتصور أنك تذود عن المبدأ!`],
 [259,`بعضهم لا يزيد على أن يخرج رقبته من (ربق) ليضعها في (ربق) آخر دون أن يشعر!`],
 [260,`كنت أدرك أنّ المؤدلج معطِّل (العقل)، واكتشفت أنه معطِّل (القلب) أيضا؛ إذْ يجد متعته في مصائب مخالفيه!`],
 [261,`أن تكون صاحب (موقف) فهذا لا يقتضي أن تكون منتميا لحزب أو تنظيم أو إيديولوجية ما... يكفي أن تكون نزيها...`],
 [262,`ما يميز المثقف الحق هو مواقفه النزيهة، ورؤيته، ووعيه واستقلاله وليس (كمّ) المعلومات التي يمتلكها...`],
 [263,`لا يمكنك أن تحتفظ بمن تحب إذا لم يكن بين قلبيكما جسر من (الثقة).`],
 [264,`الثقافة -كما أفهمها- ليست حشدا من المعلومات المتناثرة منبتة الصلة عن السلوك.. وإلا لكانت ذخائر المعلومات العامة أوضح اتصالا بالثقافة من البشر.`],
 [265,`إذا كنت لا تعترف بكلمة الحق إلا إذا جاءت ممن تحب فأنت لست مع الحق بل مع من تحب!`],
 [266,`الصباح يشعرك بوجوده لكنه لا يجبرك على معانقته... وحدك من يقرر إما أن تفعل أو تظل مشدودا إلى الليل!`],
 [267,`في الوقت الذي يستجمعون فيه قبحهم ووحشيتهم تستجمع أنت طهرك ومبادئك... أنت أقوى وإن كنت بلا مخالب!`],
 [268,`نظافة الظن واللغة والسلوك (الامتحان) الذي (يخفق) فيه المؤدلجون!`],
 [269,`للحزن وجهان: وجه (هادئ) يراه الناس، ووجه (هادر) لا يراه إلا الحزين!`],
 [271,`إذا كنت لم تحسن (التعبير) لا تلمني إذا لم أحسن (الفهم)!`],
 [272,`بعض الناس كالبالون... جاهز للانفجار عند اصطدامه بأي شيء مختلف!`],
 [273,`وممن يعانون من الجهل المركب أصحاب القوالب الجاهزة المعدة سلفا ليصنفوا فيها الناس والأفكار... مشكلتهم أنهم يثقون بفهمهم أكثر مما ينبغي!!`],
 [274,`كلما ألبسه (منافقوه) لَقَبًا أكبر منه تعثّر به وفيه!`],
 [275,`ابدأ صفحة جديدة مع صبح جديد... لا تحمله تبعات اليوم الماضي!`],
 [276,`الضمائر (الميتة) تنبعث منها روائح كريهة، تخنق من حولها، على حين لا يشمها أصحابها.`],
 [277,`المثقف له مبادئ يؤمن بها، وقضية عادلة يناضل من أجلها... والمتذرع بالثقافة قضيته هي مصالحه الشخصية؛ لذا فهو يتلفع بالثقافة لكنه لا يعيشها!`],
 [278,`دائما أمامك ما هو أجمل... فقط غيّر منظورك كي تراه!`],
 [279,`من الهدر للوقت أن تحاوره من منظور عقلاني، ويرد من منظور عاطفي... غياب الأرضية المشتركة يعني إخفاق الحوار.`],
 [280,`ربما يتدخل (اللاشعور) في بعض ما نكتب فلا نجد له تفسيرا ما دمنا في قبضة اللحظة... فإذا فلتنا من قبضتها بحثنا عن تأويل!!`]
 ]},
 {id:"self",sec:"ت",title:"باتجاه الذات",items:[
 [281,`بعض المحيطين بك لا تكتشف (وجودهم) و(وجوههم) إلا عندما تحتاج إليهم!`],
 [282,`لم تُحدِث فرقا... فقط كنتَ مجرد نقطة تتنقل على خط الزمن!`],
 [283,`أحيانا أتخيل العاطفة دائرة كبيرة، والعقل دائرة صغيرة داخلها محاصرة من جميع الاتجاهات، حتى إذا أَفْلَتَ العقل لم يزد على تبرير سلوك العاطفة!`],
 [284,`نحتفل ببزوغ الشمس، وننسى أن نشكر السراج الذي ظل يناضل وحيدا طوال الليل.`],
 [285,`من زرع (سوء الظن) حصد (سوء الفهم).`],
 [286,`يبدو أن لدى الإنسان قابلية للإنسانية والتوحش، وقابلية لملاحقة العلم والخرافة... ولن يحسم الأمر لصالح الإنسانية والعلم إلا بنضال مستمر.`],
 [287,`يَفترض دائما أن نواياه (خيّرة) وأهدافه (مشروعة)، ثم لا يهتم بعد ذلك بـ(خيرية) و(مشروعية) الوسائل التي يتذرع بها!!`],
 [288,`النبلاء لا يهجرون من احتفوا به يوما؛ لأنهم يحبون بصدق ويحتفون بصدق دون نظر إلى مكتسباتهم من العلاقة.`],
 [290,`أغلب الأعين تحوم هناك في الخارج... ليتها تدرك أن الهرب إلى الذات يريحها ويريح منها!!`],
 [291,`الموضوعية كالقمة ليس التحدي أن نصل إليها بقدر ما هو أن نستقر عليها.`],
 [292,`لكم اركضوا باتجاه الضوء كما يركض الفراش... لكن تذكروا أنه ليس لكم... الضوء الذي لكم لا يسطع إلا من داخلكم!`],
 [293,`إلى الذين أرهقهم تبديل الأقنعة... جربوا الراحة بأن تعيشوا بوجه واحد.`],
 [294,`غيّر المُغنّي لحنه وفق جوّ الحفلة إلا أن الجوقة لم تنتبه وما زالت تردد اللحن القديم!`],
 [295,`مع أن كل مرحلة تصنع تحدياتها وإشكالاتها إلا أننا ما نزال نجترّ إشكالات مراحل سابقة ونتفنن في ترميمها!`],
 [296,`الأفكار الجيدة قد تذبل لكنها لا تموت! ستزهر عندما يحين وقتها المناسب.`],
 [297,`الوفاء ليس شيئا يُحقن في الأوردة... من اعتاد الجحود حتى لو بريت أصابعك له أقلاما سيظل جاحدا!`],
 [298,`الافتتان بالذات يعميك عن أخطائها... احتقار الذات يعميك عن محاسنها... توازنْ مع ذاتك وتقبّلها.. لكن دون افتتان!`],
 [299,`يحتسي آخر جرعة من الظلام قبل أن يَمْثُل بين يدي الصباح ليشتم الليل!!`],
 [300,`- ما الذي يخيفك في هذا العالم؟\n- أنّ كل شيء صار قابلا للشراء والمقايضة!!`],
 [301,`لك عفويتك.. ولهم ظنونهم... لا تكبت (عفويتك) لتجتنب (توجساتهم).`],
 [302,`ليس هناك ما هو أسوأ حالا من ريشة سلّمت أمرها للرياح.. لا تدري إلى أي اتجاه يمكن أنْ تأخذها!`],
 [303,`إهدار (اللغة) والاحتفاء (بالفكرة) يذْهب ماء الشعر ودهشته...`],
 [304,`أن تظفر بصديق يعني أن جزءا من المناطق القاتمة في تفكيرك وعاطفتك ستظفر بحزمة من ضوء وطاقة من نور!`],
 [305,`قبل أن تحتفي بالشراع اصنع السفينة أولا!`],
 [307,`لم تتغير سيمفونيّتي... أذنك هي التي تغيرت ولم تعد تطرب لها!`],
 [308,`افتح عقلك... وافتح قلبك أيضا... العلاقة بين العقل والقلب في هذا الاتجاه ليست عكسية إلا إذا نحن أردنا أن تكون كذلك!`],
 [309,`خلق الله الإنسان مزودا بالقدرة على التفكير والاختيار ويأبى فئام من الناس إلا أن يعطلوا هذه القدرة ويجعلوا من ذواتهم دُمى تحركها أيادي الآخرين.`],
 [310,`وخزات (الحقيقة) جد مؤلمة!! وبخاصة في أذهان من اعتادوا التحليق على بساط (الوهم)!`],
 [312,`كم يبدو شاقا أن يكون الإنسان (طبيعيا) في الأوساط التي تمجد النفاق وتحتفي بالزيف!`],
 [313,`وأولئك الذين لا يرون خطاياهم وقد جاوزت الجبال ويفْلون سِيَر غيرهم فلْيا؛ ليجدوا خطيئة ليطيروا بها.. أما ارتعش لهم ضمير؟!`],
 [314,`لأنه يبحث عن الضجيج يقذف النوافذ بالحجارة ويستدير، ولا يقرع الأبواب!`],
 [315,`الحياة تقدم لنا اللوحة الخام، وتترك لنا حرية وضع الألوان وفق تكويننا وخياراتنا ومنظورنا...`],
 [316,`الإيجابيون يأخذونك إلى المناطق المشرقة، ويعينونك على اكتشاف ذاتك والإفادة من طاقاتك وقدراتك... بصحبتهم ستخطو إلى الأمام... #باتجاه_الذات`],
 [317,`الانهزاميون ينمون (نقائصك) ويثمرون ضعفك، لترى العالم حزمة من الأقوياء أنت فيه الضعيف الأوحد! #باتجاه_الذات`],
 [320,`ضاق أفقه حتى عجبتُ كيف أنه لم يختنق بعد؟!`],
 [321,`بقدر ما يضخ في وريد الإنسان من "الإنسانية" يخنس "الوحش" الذي بداخله...`],
 [322,`مع أنّ العقل يتكلم بصوت هادئ إلا أن بعضهم ينزعج منه!`],
 [323,`كلما رفعتَ سقف توقعاتك من الآخرين عرضتَ نفسك لمزيد من خيبات الأمل!`],
 [326,`يحفظ عددا من (القوالب)، لكنه باستمرار يخطئ فلا يضعها في مكانها المناسب!`],
 [327,`بعض الناس قد يكون لديه ما يقوله... لكنه مصاب بعمى "الوقت المناسب"!`],
 [328,`حينما (تصفي حساباتك) مع خصمك بأدواته التي كنت تنعاها عليه، فالفارق بينكما يكمن في فارق التوقيت فقط! #تدل_دربها`],
 [329,`بعضنا أخطأ إذْ وضَعهم في هالة بيضاء لا يناوشها الخطأ... وبعضهم أخطأ إذْ راق له الدور وتقمّصه!`],
 [330,`لا تحتاج إلى ذكاء لتقيّدهم بالوهْم... كل ما تحتاج إليه (ضمير ميت)!`],
 [331,`كن ممتنا لكل (صدمة) أيقظتك من (وهم)!`],
 [332,`أيقظ شراعك... فالأشرعة الغافية لا تصل.`],
 [334,`كل إنسان قابل للتعلم إلا جاهلا ظن بنفسه خيرا فاعتقد أنه عالم!`],
 [335,`لم يدهشهم من الفراش جماله... أدهشهم فقط التفافه على الضوء فقلدوه!`],
 [336,`ماذا لو تخلى الضوء الذي في آخر النفق عن دوره في ضخ الأمل في نفوسنا، وتركنا وجها لوجه مع الظلام وحدنا؟!`],
 [337,`الناس عندما يستغنون عن (كلماتهم) لا يعلقونها في مشجب وإنما يلقون بها في مقبرة الكلمات كدليل على أنهم لن يحتاجوا إليها مرة أخرى!`],
 [338,`كلما غادرْنا (ميناء) سقط فيه جزء منا لا يعود...`],
 [339,`يخفت صوت جرحك عندما تصغي إلى جراح الآخرين!`],
 [340,`إذا لم تُحسن فهم ما تقرأ فأنت تبني على (أوهامك) لا على (ما تقرأ).`],
 [341,`تظلّ أحلامنا عصيّة على الانكسار حتى تشيخ قلوبنا... فتتكسر أحلامنا فجأة!`],
 [342,`كلما ضاق أفق الإنسان الفكري ضاق صدره بالمختلف!`],
 [343,`ما دامت أيامك لن تضاء إلا بقناديل جراحي... لا بأس أوقد ما تبقى منها إذن!`],
 [344,`ينزلق من أمامي كما ينزلق (الوقت)! لا هو بالذي وقف، ولا أنا بالذي هدأتُ!`],
 [345,`سنكون أقل ضجيجا.. لو اكتفى أحدنا بالحديث عما يعرف، وصمت عما لا يعرف حتى يعرف...`],
 [346,`لا يمكنك أن تلعب دور الشمعة دون أن تحترق!`],
 [347,`كل (جهة) تطل منها ولا ترى (ذاتك) تقول لك: أنت تطل من المكان الخطأ!`],
 [348,`أعمق ابتسامة لا تصنعها الشفاه وحسب، بل تصنعها العينان والشفاه في تناغم يشبه انسدال الضوء على نسائم الصباح.`],
 [349,`لا تذوي الوردة إلا إذا شعرت بتململ الآخرين.`],
 [350,`منذ أن اكتشفت أني لست ملاكا ولست شيطانا بدأت أتصالح مع نفسي ومع الآخرين!!`],
 [351,`كلما اتسعت الفجوة بينك وبين أحلامك استحالت من "باعث" إلى "عبء"!`],
 [353,`منذ أحببتك والكلمات تركض إلى شفتيّ.. ثم تُطرِقُ وتذوي فجأة!!`],
 [354,`إلى متى وأنت تقلّم روحك، وتكمش أجنحتك؛ لتنضوي في قمقمهم الذي لا يتسع إلا لهم؟!`],
 [355,`سوء الظن ليس ذكاء، هو بالأحرى إلباس أقوال الآخرين وأفعالهم بما تتوهمه أنت!`],
 [356,`فلسفيا اتخذ بعضهم (Pico) رمزا لمن يتحدث في كل شيء دون أن يفقه أي شيء! وبعضهم اتخذه رمزا لشاب مثقف واسع الاطلاع خَبَر عددا من اللغات والفنون!`],
 [357,`س: هل يمكن أن يكرّس أحد (الجهل) ويشجع عليه؟!!\nج: نعم، إذا كان مجده مرهونا بالوقوف على جماجم الجهلاء!!`],
 [358,`ليس بالصديق ذلك المرهون باتفاق وجهات النظر أو اختلافها... أصدقاؤنا الذين يتقبلوننا كما نحن.`],
 [361,`العقل الحدّي يخسر مرتين: مرة في قصوره عن الرؤية إلا عبر منظوره، ومرة بكتم الأصوات المجاورة التي كان يمكن أن تفتح له آفاقًا أرحب!`],
 [362,`كل خيبة تضيء عتمة!`],
 [363,`كل خيبة ظن في أحدهم لا تأتي وحدها، بل تأتي وبيدها مصباح ينير لك التجارب المماثلة... ركز على المصباح وتجاوز الخيبة.`],
 [364,`الجدّية لا تعني القسوة والجلافة و(التكشير)، يمكنك أن تكون جادًّا وأنت تبتسم!`],
 [365,`لسنا مضطرين لأنْ نختبر وفاء كل شخص وصدقه معنا، الأيام ستفعل ذلك، وعلينا أن نستوعب الدرس جيدًا!`],
 [366,`ستدفع ثمن عفويتك يومًا، والمهم ألا يكون الثمن غاليًا! وهذا ليس معناه أن تتنازل عن عفويتك فلا شيء يعدلها، لكن معناه أن تتقبل ما ستلقاه في سبيلها!`],
 [367,`ليس هناك ما يدعو للنضال دون رأيك الذي تقدمه عن طيب خاطر للآخرين، أنت "قمت باللي عليك" وهم إما أن يفكروا في رأيك وإما أن يتمسكوا بكبريائهم الذي يرون أن رأيك ينتهكه!!`],
 [368,`مرآة العاطفة ليست (مستوية)، فهي على الأغلب إما محدبة أو مقعرة!`],
 [369,`انشغلوا بعيوبنا.. فتناسلت عيوبهم دون أن يفطنوا.`],
 [370,`الذين تقضمهم الشكوك والتوجسات يرون في كل زهرة فخا.`],
 [371,`أحيانًا، نسمع ما (توقعنا) أنه سيقال، وليس ما قيل بالضرورة.`],
 [372,`تبقى قابليتنا للتعلم والتطور إلى أن نظن أننا كبرنا واكتفينا.`],
 [373,`الحياة تعاقبك أولا، ثم تعلمك الدرس!`],
 [374,`العقلية الوصائية تعتقد أنها تحتكر الحقيقة والصواب المطلق؛ ولذلك تتعب كل من حولها، ومن اضطرته ظروفه للبقاء والتعامل معها.`],
 [375,`الذي اعتاد على سلوك الطرق الملتوية ورآها مهارة سيزعجه من ينادي بسلوك الطريق المستقيم!`],
 [376,`من أجل راحتك على الأقل، ليس من الضروري أن يكون لك في كل أمر رأي، ولا على كل شخص حكم، ولا على كل مقصر عتب!`],
 [377,`كف عن مراقبة سلوك الآخرين، وراقب سلوكك واشتغل بنفسك ففيها ما يشغلك عن أمور الآخرين!`],
 [378,`الإفراط في كل شيء مذموم، حتى الإفراط في التواضع هو كبر مقنع.`],
 [379,`كل الذين عاندوا طبيعتهم الإنسانية فشلوا أو في طريقهم للفشل!\nوعليه لا تدعِ (المثالية)؛ فطبيعتك الإنسانية لا تقبل المثالية المطلقة...\nويبدو أن إدراك هذه الطبيعة أو الجبلّة سيعين المرء على تقبل نفسه، وتقبل الآخرين! وإراحة نفسه من الادعاءات الزائفة.`],
 [380,`الفرق بين (الفيلسوف) و(القارئ في الفلسفة) أنّ الأول يدرك كَمَّ (ما لا يدريه)؛ فيتواضع، والثاني يدرك كَمَّ (ما قرأه)؛ فيتعالى!!`]
 ]}]},
{part:"أشطر يتيمة",chapters:[
 {id:"verses",sec:"ش",title:"أشطر يتيمة",verse:true,items:[
 [1,`مرافئُ الحُزْن تُدْنيني إلى ذاتي وتصطفيني\nإلى أنقى احتمالاتي\nتعتَّقت من صهيل الحزن أوردتي\nوأورقت في فم الموال آهاتي`],
 [2,`أسرج وريدك.. كلما غفت الجراح على الظنون العابرة`],
 [3,`واليوم... أرْخَتْ حبالُ الوقت أشرعتي\nواحدودب العمرُ.. واصفرّتْ أمانيهِ!`],
 [4,`كلما لُذْتُ بحُلمٍ... أيقظَ (الأمس) إساره`],
 [5,`يا حرفها المغموس في شَفَةِ الرحيلْ`],
 [6,`تستافنا لغة الأسى.. تمتصنا شفة الأنين.. وتحتسينا ساخرة!`],
 [7,`شوقًا يُفتّتُنا الحنينُ.. لزفرتين.. وذاكرة`],
 [8,`نلوذ بصمتنا.. والوقتُ جمرٌ\nوتقتبس الجراح.. من الجراحِ!`],
 [9,`ويُحكَى أنّ قلبًا مالَ وجْدًا\nعلى كتف الزمان.. فضاعَ فُلُّ!\nوأصغى الوردُ.. وانسكبتْ أغانٍ\nعلى شفةِ النسيمِ.. وماد ظِلُّ!`],
 [10,`ويحكى أن قلبًا كان نايًا\nيغني للحياة و"للأماني"\nفطوّقهُ الحنينُ غداةَ نجوى\nوبعثر في شواطئه المواني\nفصار القلب كالعرجون يذوي\nوذاب على السكون فم الأغاني!`],
 [11,`أُحبُكِ.. لم يعد للصمتِ جدوى\nتَلَكّأَ بوحُنا والوقتُ يمضي\nأُحبُكِ شابَ عُكازُ انتظاري\nوبعضي في الغرام يلوكُ بعضي!!`],
 [12,`يا نازفَ الحزنِ في كفِّ التآويهِ\nلا نايَ يُصغي إلى المعنى فيَرويهِ\n\nيا نازفَ الحزنِ كَلَّ الليلُ وانصرفتْ\nعكازُه، والخطا باعتْهُ للتيهِ!!`],
 [13,`ووعدتِني، كل الظروف العاتيات\nستستكينْ\nوأنا أظلك غيمة وسنى\nيناغيها الحنينْ\nووعدتني.. ووعدتني..\nفمتى بربك تهطلين؟`],
 [14,`ولي منك ما لم تقلْهُ الحكايا\nوما شاءه الحبُّ.. للأعينِ السادرةْ!\nوما قد وَشَتْ سارحاتُ الظنون\nوما لم تُذِعْهُ... عن النبضة الحائرةْ!`],
 [15,`وأحار..\nتأخذني الطيوف.. إلى مداك\nوأحتسي نخب الفتون...\nوأعود أنفض راحتيَّ..\nوما ارتويت من العناق..\nولا ارتويت من العيون!`],
 [16,`أعيري المدى عينيك كي تخصب الرؤى\nوأرخي على الآفاق أجفانك الوسنى\n\nأريقي على محدودب النبض بسمةً...\nففي ثغرك الوقّاد مدفؤه الأحنى!`],
 [17,`سلامٌ على الصادقين\nإذا أعْتمَ الفجرُ\nواسْتَوْفزَ الليلُ\nيُؤَرْجِحُ نجمَ الشمالِ ليغفوْ\nسلامٌ عليهم وقد أشْعلوا فجْرَ أرواحِهم\nلكي يَسْتديرَ السُّراةُ ويقفوا\nسلامٌ عليهم إذا اسْتَنْكفَ القومُ أنْ يقتفوا وَحْيَهم..\nسلامٌ عليهم إذا صَعّر التائهون...\nإذا انْشَقَّ وَجْهُ الصباحِ..\nوأغْضوا على الجاهلين..\nوقاموا ليَرْفوا!`],

function layout(target){
  const stage=$("stage"),clip=$("clip"),flow=$("flow");if(!stage)return;
  const foot=document.querySelector(".rfoot"),hint=$("rhint");
  const top=stage.getBoundingClientRect().top+window.scrollY;

  stage.style.height=Math.round(Math.max(380,Math.min(window.innerHeight-top-below,1000)))+"px";
  const cs=getComputedStyle(stage);
  const W=Math.floor(stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight));
  const H=Math.floor(stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom));
  R.W=W;
  clip.style.width=W+"px";clip.style.height=H+"px";
  Object.assign(flow.style,{width:W+"px",height:H+"px",columnWidth:W+"px",columnGap:R.G+"px",transform:"none"});
  flow.style.setProperty("--H",H+"px");
  const fr=flow.getBoundingClientRect(),step=W+R.G;
  const pg=el=>Math.max(0,Math.floor((fr.right-el.getBoundingClientRect().right+2)/step));
  R.els=[...flow.querySelectorAll(".item")];R.itemPg=R.els.map(pg);
  R.starts=[...flow.querySelectorAll("[data-ch]")].map(el=>({id:el.dataset.ch,p:pg(el)}));
  R.pages=pg(flow.lastElementChild)+1;
  let p=Math.min(R.page,R.pages-1);
  if(target&&target.ch){const s=R.starts.find(s=>s.id===target.ch);if(s)p=s.p}
  else if(target&&target.item){const i=R.els.findIndex(e=>e.id===target.item);if(i>=0)p=R.itemPg[i]}
  setPage(p);
}

  let cur=null;R.starts.forEach(s=>{if(s.p<=n)cur=s});

/* الورق يُسمع خشخشةً من طقطقات دقيقة متقطعة لا نَفَسًا متصلًا:
   طبقة حفيف متذبذبة السعة + حبيبات طقطقة كثيفة في منتصف القلبة + خبطة ورقة عند الاستقرار */
const PAPER_VOL=.18;
function paperBuf(ctx,dur){
  const sr=ctx.sampleRate,n=Math.floor(sr*dur),b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0);
  const env=x=>Math.pow(Math.sin(Math.PI*Math.min(1,x*1.08)),1.4);
  let a=0,target=0,next=0;
  for(let i=0;i<n;i++){
    if(i>=next){target=Math.random()<.25?Math.random()*.15:.35+Math.random()*.65;next=i+Math.floor(sr*(.003+Math.random()*.016))}
    a+=(target-a)*.05;d[i]=(Math.random()*2-1)*a*.32*env(i/n);
  }
  let t=0;
  for(;;){
    const x=Math.min(t/dur,1),dens=50+900*env(x);t+=-Math.log(1-Math.random())/dens;
    const i0=Math.floor(t*sr);if(i0>=n)break;
    const amp=(.25+Math.random()*.75)*env(i0/n),len=Math.floor(sr*(.0005+Math.random()*.003)),sg=Math.random()<.5?-1:1;
    for(let k=0;k<len&&i0+k<n;k++)d[i0+k]+=sg*amp*(.3+Math.random()*.7)*Math.exp(-k/(len*.3));
  }
  let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(d[i]));if(pk)for(let i=0;i<n;i++)d[i]/=pk;
  return b;
}
function flapBuf(ctx){const sr=ctx.sampleRate,n=Math.floor(sr*.04),b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);return b}
function paperSound(ctx,t,out,vol){
  const dur=.42+Math.random()*.06;
  const s=ctx.createBufferSource();s.buffer=paperBuf(ctx,dur);s.playbackRate.value=.92+Math.random()*.12;
  const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=800;
  const pe=ctx.createBiquadFilter();pe.type="peaking";pe.frequency.value=2400;pe.Q.value=.9;pe.gain.value=5;
  const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=6000;
  const g=ctx.createGain();g.gain.value=vol;
  s.connect(hp).connect(pe).connect(lp).connect(g).connect(out);s.start(t);
  const f=ctx.createBufferSource();f.buffer=flapBuf(ctx);
  const fb=ctx.createBiquadFilter();fb.type="bandpass";fb.frequency.value=1200;fb.Q.value=.8;
  const g2=ctx.createGain();g2.gain.value=vol*.8;
  f.connect(fb).connect(g2).connect(out);f.start(t+dur*.88);
  return dur;

const CLIP_VOL=0.196;
let CLIP_BUFS=null,clipLoading=null,lastClip=-1;
function b64buf(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function loadClips(){
  if(clipLoading)return clipLoading;
  clipLoading=Promise.all(CLIPS.map(s=>new Promise((res,rej)=>{try{const r=AC.decodeAudioData(b64buf(s),res,rej);if(r&&r.then)r.then(res,rej)}catch(e){rej(e)}})))
    .then(bs=>{CLIP_BUFS=bs}).catch(()=>{CLIP_BUFS=[]});
  return clipLoading;
}
function playClip(){
  if(!CLIP_BUFS||!CLIP_BUFS.length){paperSound(AC,AC.currentTime+.01,AC.destination,PAPER_VOL);return}
  let k;do{k=Math.floor(Math.random()*CLIP_BUFS.length)}while(k===lastClip&&CLIP_BUFS.length>1);lastClip=k;
  const s=AC.createBufferSource();s.buffer=CLIP_BUFS[k];s.playbackRate.value=.88+Math.random()*.04;
  const g=AC.createGain();g.gain.value=CLIP_VOL;s.connect(g).connect(AC.destination);s.start(AC.currentTime+.35);
}
function flipSound(){
  if(!sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    if(CLIP_BUFS)playClip();else loadClips().then(playClip);
  }catch(e){}
}
function turn(d){
  if(R.anim)return;const n=R.page+d;if(n<0||n>=R.pages)return;
  const hint=$("rhint");if(hint){hint.remove();st.set("hinted",true)}
  flipSound();
  if(reduced()||!Element.prototype.animate){setPage(n);return}
  const stage=$("stage"),clip=$("clip");
  const W=stage.clientWidth,H=stage.clientHeight,pad=getComputedStyle(stage).padding;
  /* لقطة من الصفحة الحالية بحجمها الكامل */
  const snap=left=>{const s=document.createElement("div");
    s.style.cssText=`position:absolute;top:0;left:${left}px;width:${W}px;height:${H}px;padding:${pad};box-sizing:border-box;background:var(--sheet)`;
    const c=clip.cloneNode(true);c.removeAttribute("id");c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
    /* في النسخة: إزاحة بالموضع بدل التحويل، حتى لا ينشئ سفاري طبقة رسومية بعرض الكتاب كله فيعجز عن رسمها */
    const fl=c.firstElementChild;fl.style.transform="none";fl.style.willChange="auto";fl.style.position="relative";fl.style.left=(R.page*(R.W+R.G))+"px";
    s.appendChild(c);return s};
  /* الورقة المنثنية: ثلاث شرائح متسلسلة من الكعب إلى الحافة الحرة، كل شريحة تدور فوق التي قبلها فيتكوّن منحنى */
  const SEG=[.4,.3,.3];                 /* عرض الشرائح: قرب الكعب، الوسط، الحافة الحرة */
  const ANG=[[0,10,42,80,180],          /* شريحة الكعب: تحمل الورقة كلها في القلبة */
             [0,30,45,38,0],            /* الوسط: انحناء */
             [0,45,58,45,0]];           /* الحافة الحرة: ترتفع أولًا وتلتف أكثر */
  const SHADE=[[0,.5,.8,.45,0],[0,.8,1,.6,0],[0,1,1,.7,0]];
  const leaf=()=>{
    const root=document.createElement("div");root.className="leaf";root.setAttribute("aria-hidden","true");
    let parent=root,right=W;const parts=[];
    SEG.forEach((f,k)=>{const w=Math.round(W*f);
      const p=document.createElement("div");p.className="lp";p.style.width=w+"px";p.style.height=H+"px";
      p.style.right=k===0?"0":"100%";
      const fc=document.createElement("div");fc.className="lf";fc.appendChild(snap(-(right-w)));
      const sh=document.createElement("div");sh.className="lsh";fc.appendChild(sh);
      const b=document.createElement("div");b.className="lb";p.append(fc,b);
      parent.appendChild(p);parent=p;right-=w;parts.push({p,sh,b});
    });
    return{root,parts};
  };
  const cast=()=>{const c=document.createElement("div");c.className="castsh";return c};
  R.anim=true;
  const opt={duration:1800,easing:"cubic-bezier(.42,0,.38,1)",fill:"forwards"};
  const OFF=[0,.25,.55,.85,1];   /* الورقة تبقى ظاهرة فوق الصفحة أطول مدة، ولا تعبر الكعب إلا في آخر القلبة */
  const kf=(arr,rev)=>(rev?[...arr].reverse():arr).map((a,k)=>({transform:`rotateY(${a}deg)`,offset:OFF[k]}));
  const okf=(arr,rev)=>(rev?[...arr].reverse():arr).map((o,k)=>({opacity:o,offset:OFF[k]}));
  const backFade=rev=>rev?[{opacity:0},{opacity:1,offset:.18},{opacity:1}]:[{opacity:1},{opacity:1,offset:.82},{opacity:0}];
  const run=(L,rev,extra)=>{
    const c=cast();stage.appendChild(c);stage.appendChild(L.root);
    const anims=[];
    L.parts.forEach((s,k)=>{anims.push(s.p.animate(kf(ANG[k],rev),opt));s.sh.animate(okf(SHADE[k],rev),opt);s.b.animate(backFade(rev),opt)});
    c.animate(okf([0,.5,.75,.35,0],rev),opt);
    let ended=false;const fin=()=>{if(ended)return;ended=true;L.root.remove();c.remove();extra.forEach(e=>e.remove());R.anim=false};
    anims[0].onfinish=fin;setTimeout(fin,opt.duration*2+1500);   /* احتياط إن لم يُعلن المتصفح انتهاء الحركة */
  };
  /* نمط بسيط ثنائي الأبعاد: الورقة تنزلق نحو الكعب وتتلاشى، لمن لا يعرض جهازه الحركة المجسّمة */
  if(motion==="simple"){
    const flat=()=>{const f=document.createElement("div");f.className="flatpg";f.style.zIndex="4";f.appendChild(snap(0));return f};
    const c=cast();const o2={duration:1100,easing:"cubic-bezier(.42,0,.38,1)",fill:"forwards"};
    const away=[{transform:"translateX(0) scaleX(1)",opacity:1},{transform:`translateX(${Math.round(W*.35)}px) scaleX(.15)`,opacity:0}];
    let A,B;
    if(d>0){A=flat();setPage(n);stage.append(c,A);A.style.transformOrigin="right center";
      c.animate([{opacity:.6},{opacity:0}],o2);let e1=false;const f1=()=>{if(e1)return;e1=true;A.remove();c.remove();R.anim=false};
      A.animate(away,o2).onfinish=f1;setTimeout(f1,o2.duration*2+1500)}
    else{A=flat();setPage(n);B=flat();stage.append(A,c,B);B.style.transformOrigin="right center";
      c.animate([{opacity:0},{opacity:.6}],o2);let e2=false;const f2=()=>{if(e2)return;e2=true;A.remove();B.remove();c.remove();R.anim=false};
      B.animate([...away].reverse(),o2).onfinish=f2;setTimeout(f2,o2.duration*2+1500)}
    return;
  }
  if(d>0){const L=leaf();setPage(n);run(L,false,[])}
  else{const under=document.createElement("div");under.className="flatpg";under.appendChild(snap(0));
    setPage(n);const L=leaf();stage.appendChild(under);run(L,true,[under])}
}
document.addEventListener("keydown",e=>{
  if(!R.on||e.target.closest&&e.target.closest("input,textarea"))return;
  if(e.key==="ArrowLeft"||e.key==="PageDown"){e.preventDefault();turn(1)}
  else if(e.key==="ArrowRight"||e.key==="PageUp"){e.preventDefault();turn(-1)}
});
let rsz=null;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(R.on)layout({item:R.anchor})},200)});

/* التنقل: لا نعتمد على أن يغيّر المتصفح عنوان الصفحة حين يُضغط الرابط،
   فبعض العارضات (كتطبيقات الهاتف) تعترض الروابط؛ نوجّه الصفحة بأنفسنا */
let curHash=null;
document.addEventListener("click",e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
  e.preventDefault();curHash=a.getAttribute("href").slice(1);
  try{history.pushState(null,"","#"+curHash)}catch(_){}
  route();
},true);
window.addEventListener("popstate",()=>{curHash=null;route()});
/* إن وقع خطأ في جهاز القارئ يظهر نصه أسفل الصفحة ليسهل تشخيصه */
window.addEventListener("error",e=>{try{const t=document.createElement("div");t.className="toast";t.style.maxWidth="90%";t.textContent="خطأ: "+(e.message||"غير معروف");document.body.appendChild(t);setTimeout(()=>t.remove(),8000)}catch(_){}});
function route(){
  const h=decodeURIComponent(curHash!=null?curHash:location.hash.slice(1));
  R.on=false;view.classList.remove("rd");
  const c=CH.find(c=>c.id===h);
  if(c){mode==="book"?reader({ch:c.id}):chapter(c)}
  else if(h==="read"){mode==="book"?reader({}):chapter(CH.find(c=>c.id===st.get("last","leaf-branch"))||CH[0])}
  else if(h.startsWith("i-")){
    if(mode==="book")reader({item:h});
    else{const x=ALL.find(x=>"i-"+x.ch.id+"-"+x.o===h);chapter(x?x.ch:CH[0]);
      setTimeout(()=>{const el=document.getElementById(h);if(el)el.scrollIntoView({block:"center"})},0);return}
  }
  else if(h==="contents")contents(); else if(h==="random")random();
  else if(h==="search")search(); else if(h==="saved")savedView(); else if(h==="edits")edits(); else cover();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{curHash=null;route()});

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-save]");
  if(s){const k=s.dataset.save; saved.has(k)?saved.delete(k):saved.add(k); st.set("saved",[...saved]);
    const on=saved.has(k);
    if(s.classList.contains("icon")){s.classList.toggle("on",on);s.setAttribute("aria-pressed",on);s.innerHTML=(on?ICO.leafOn:ICO.leaf)+`<span>${on?"محفوظة":"احفظ"}</span>`}
    else s.textContent=on?"محفوظة":"احفظها";
    toast(on?"حُفظت":"أُزيلت من المحفوظات");return}
  const c=e.target.closest("[data-copy]");
  if(c){const x=ALL.find(a=>a.key===c.dataset.copy);const txt=`${x.t}\n— عبدالرحمن البارقي، الورقة والغصن`;
    const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("نُسخ النص")}catch(_){toast("حدّد النص وانسخه يدويًا")}ta.remove()};
    try{navigator.clipboard.writeText(txt).then(()=>toast("نُسخ النص"),fb)}catch(_){fb()}return}
  const f=e.target.closest("[data-fix]");
  if(f){const box=f.closest(".body").querySelector(".orig");box.hidden=!box.hidden;f.setAttribute("aria-expanded",!box.hidden);if(R.on)layout({item:f.closest(".item").id})}
});

/* إعدادات العرض */
const setBtn=document.getElementById("setBtn"),sets=document.getElementById("settings");
setBtn.onclick=()=>{sets.hidden=!sets.hidden;setBtn.setAttribute("aria-expanded",!sets.hidden)};
let fs=st.get("fs",19);const applyFs=()=>{document.documentElement.style.setProperty("--fs",fs+"px");if(R.on)layout({item:R.anchor})};applyFs();
document.getElementById("fsUp").onclick=()=>{fs=Math.min(26,fs+1);st.set("fs",fs);applyFs()};
document.getElementById("fsDown").onclick=()=>{fs=Math.max(15,fs-1);st.set("fs",fs);applyFs()};
const applyTh=t=>{t?document.documentElement.setAttribute("data-theme",t):document.documentElement.removeAttribute("data-theme")};
applyTh(st.get("th",""));
sets.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{st.set("th",b.dataset.th);applyTh(b.dataset.th)});
sets.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;st.set("mode",mode);route()});
sets.querySelectorAll("[data-motion]").forEach(b=>b.onclick=()=>setMotion(b.dataset.motion));syncMotion();
document.getElementById("sndBtn").onclick=toggleSnd;syncSnd();

route();
</script>
</body>
</html>
